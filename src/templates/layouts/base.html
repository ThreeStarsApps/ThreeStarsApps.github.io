{% import "components/ui.html" as ui with context %}
<!doctype html>
<!-- Generated by scripts/build_site.py. Edit src/templates/ or src/content/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="{{ 'noindex, follow' if page.noindex else 'index, follow, max-image-preview:large' }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="{{ 'article' if page.article else 'website' }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.socialImage }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.socialImageAlt }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.socialImage }}">
  <link rel="icon" href="/assets/images/brand-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/site.js" defer></script>
  <script type="application/ld+json">{{ structured_data | safe }}</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "components/header.html" %}
  <main id="main">
    {% if page.breadcrumbs %}{{ ui.breadcrumbs(page.breadcrumbs) }}{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% include "components/footer.html" %}
  <dialog class="image-dialog" aria-label="App screenshot" data-image-dialog>
    <button class="dialog-close" aria-label="Close screenshot" type="button" data-dialog-close>×</button>
    <img alt="">
  </dialog>
</body>
</html>
